name: ニュース更新

on:
  schedule:
    # 日本時間 7:00 / 12:00 / 17:00 / 21:00（cron は UTC）
    - cron: "0 22,3,8,12 * * *"
  workflow_dispatch:   # 手動実行ボタン
  push:
    branches: [main]
    paths: ["templates/**", "static/**", "hat2/**", "config.yaml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 収集・要約・サイト生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m hat2 update

      - name: 記事データを保存
        run: |
          git config user.name "hat2-bot"
          git config user.email "hat2-bot@users.noreply.github.com"
          git add data/articles.json
          git diff --cached --quiet || git commit -m "ニュース更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
